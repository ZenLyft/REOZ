[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenlyft-ascension"
version = "0.1.0"
description = "ZenLyft Ascension — Unified Multi-Agent Workforce (LangGraph + CrewAI + Orchester Protocol + n8n + G.E.N.I.)"
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/ascension"]

