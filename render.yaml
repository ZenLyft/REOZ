services:
  - type: web
    name: zenlyft-ascension
    runtime: python
    plan: free
    buildCommand: pip install -r ascension/requirements.txt
    startCommand: uvicorn ascension.backend.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOW_PAID_FALLBACK
        value: "false"
      - key: ASCENSION_ENV
        value: "render-free"
      - key: ASCENSION_MAX_CONCURRENT_AGENTS
        value: "5"
      - key: ASCENSION_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASCENSION_API_SECRET
        sync: false

